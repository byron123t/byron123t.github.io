title: "h/acc manifesto"
description: "h/acc (hacking accelerationism)—placeholder theses on disruption, equity, open tools, and ethical hacking."

remote_theme: byron123t/hacked-jekyll

exclude:
  - LICENSE
  - README.md
  - Gemfile
  - vendor/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-remote-theme

sass:
  sourcemap: never
  