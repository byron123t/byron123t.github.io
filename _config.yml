title: Hacked Jekyll
description: Jekyll microtheme that looks like JSON
baseurl: /hacked-jekyll
url: https://piazzai.github.io

remote_theme: piazzai/hacked-jekyll

exclude:
  - LICENSE
  - README.md
  - Gemfile
  - vendor/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-remote-theme

sass:
  sourcemap: never
  