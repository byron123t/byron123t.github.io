title: "h/acc manifesto"
description: "h/acc (hacking accelerationism): reverse engineering, open source, and why the future belongs to hackers."

remote_theme: byron123t/hacked-jekyll

exclude:
  - LICENSE
  - README.md
  - Gemfile
  - vendor/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-remote-theme

sass:
  sourcemap: never
  