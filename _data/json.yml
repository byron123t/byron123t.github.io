- key: "h/acc manifesto"
  value:
  - "h/acc (hacking accelerationism): using accelerationism, technology, speed for open source and hacking."
  - "proprietary is now open source. a frontier model with ghidra turns any binary back into readable source. compiling was never encryption, just a delay."
  - "reverse engineering is the new pretraining. decompile, refactor, verify it rebuilds, train on it, repeat. the data wall only exists for people who can't read machine code."
  - "tech should belong to everyone, not just three cloud providers. when weights get locked, steal the keys, or distill the weights and release them."
  - "disruption is the core tenet of healthy capitalism. the question isn't whether corporations profit, but when their tech gets breached and open sourced."
  - "closed source is unstable. defenders must secure every surface, attackers only need a few vulnerabilities, and the barrier to hacking drops faster than anyone can patch."
  - "the bottleneck was never generation, it's error correction. code checks itself: it compiles, or it doesn't. the exploit crashes, or it doesn't. whoever owns the cheapest falsifier owns the fastest feedback loop, and that's always been the hacker."
  - "open source is a competitive strategy. more eyes, more forks, more experiments. it out-evolves closed source because it keeps the diversity that rent extraction suppresses."
  - "hacking is just more equitable innovation with a shorter feedback loop. every jailbreak and model extraction proves the moat was never technical, just legal and social."
  - "every sandbox will be tested by something that never sleeps. a falsifier only counts if the optimizer can't touch it, and safety that can't survive an adversary is just marketing."
  - "something bad will save us. any world with doom is first a world with other really bad things. don't safety-wash them small enough to shrug off. hackers break things early and loudly, so the warning shot lands while it's still survivable."
  - "the future belongs to people who can read the machine. when agents write all the code, the scarce skill is breaking, verifying, and knowing when there's nothing there."
  - "the singularity will not require a subscription. gatekeeping intelligence is the real alignment failure. compute, infrastructure, and models should be free for anyone."
  - "you can't patch out curiosity. accelerate for the love of the game. h/acc will make sure the door stays open to everyone."
  typed: true
