  <script>
    // Append each string as a new array element, cycling until the page is full
    (function () {
      var list = document.getElementById("typed");
      if (!list) return;
      var strings = Array.prototype.map.call(
        document.querySelectorAll("#strings span"),
        function (el) { return el.textContent; }
      );
      var quote = list.dataset.quote, comma = list.dataset.comma;
      var typeSpeed = 30, pause = 3000;
      var instant = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var cursor = document.createElement("span");
      cursor.className = "typed-cursor";
      cursor.textContent = "|";
      var count = 0, prev = null;

      function pageFull() {
        return document.documentElement.scrollHeight > window.innerHeight;
      }

      function nearBottom() {
        return window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 80;
      }

      function next() {
        if (count >= strings.length && pageFull()) {
          cursor.remove();
          return;
        }
        if (prev) prev.appendChild(document.createTextNode(comma));
        var p = document.createElement("p");
        p.className = "ms";
        var value = document.createElement("span");
        value.className = "value";
        p.appendChild(document.createTextNode(quote));
        p.appendChild(value);
        var close = document.createTextNode("");
        p.appendChild(close);
        p.appendChild(cursor);
        list.appendChild(p);
        prev = p;
        var text = strings[count % strings.length], i = 0;
        count++;
        if (instant) {
          value.textContent = text;
          close.textContent = quote;
          return next();
        }
        (function type() {
          var follow = nearBottom();
          value.textContent = text.slice(0, ++i);
          if (follow) window.scrollTo(0, document.documentElement.scrollHeight);
          if (i < text.length) {
            setTimeout(type, typeSpeed * (0.5 + Math.random()));
          } else {
            close.textContent = quote;
            setTimeout(next, pause);
          }
        })();
      }

      next();
    })();
  </script>
